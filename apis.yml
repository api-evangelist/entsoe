apis:
  - name: ENTSO-E Transparency Platform REST API
    description: >-
      Synchronous RESTful interface for accessing European electricity market
      data including load, generation, transmission, balancing, outages,
      congestion management, and system operations datasets. Authentication
      requires a security token obtained by registering on the Transparency
      Platform and emailing transparency@entsoe.eu. The API accepts GET requests
      with query parameters and returns XML responses.
    humanURL: https://transparency.entsoe.eu/
    baseURL: https://web-api.tp.entsoe.eu/api
    tags:
      - Electricity Market Data
      - Load Data
      - Generation Data
      - Transmission Data
      - Balancing Data
      - Day-Ahead Prices
      - Cross-Border Flows
