name: ENTSO-E
description: >-
  European Network of Transmission System Operators for Electricity (ENTSO-E)
  provides the Transparency Platform REST API, a synchronous RESTful interface
  for accessing pan-European electricity market data. The API delivers datasets
  covering load forecasts, actual generation per type and per plant, installed
  generation capacity, day-ahead prices, cross-border flows, scheduled exchanges,
  transfer capacities, balancing data, hydro storage, outage information, and
  congestion management data. Data is collected from Transmission System
  Operators, power exchanges, and qualified third-party providers across Europe
  in compliance with EU Regulation 543/2013.
image: https://www.entsoe.eu/assets/images/entsoe-logo.png
tags:
  - Energy
  - Electricity
  - European Union
  - Transparency
  - Market Data
